# 本地开发用的 PostgreSQL。
#
# 启动：pnpm db:up      停止：pnpm db:down      连数据一起清理：docker compose down -v
#
# 如果本机 5432 端口已经被别的 PostgreSQL 占用（很常见），两个办法二选一：
#   1) 换端口启动：$env:POSTGRES_HOST_PORT=55432; pnpm db:up
#      同时把 apps/server/.env 里的 DATABASE_URL 端口改成 55432
#   2) 直接用本机已有的 PostgreSQL，只改 DATABASE_URL，不用起容器
services:
  postgres:
    image: postgres:17-alpine
    container_name: cinelndex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cinelndex
      POSTGRES_PASSWORD: cinelndex
      POSTGRES_DB: cinelndex
      # 排序规则固定下来，避免本地与 CI 行为漂移
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - cinelndex-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cinelndex -d cinelndex']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  cinelndex-pgdata:
